name: ci

# Lint, generated files, licences, the tests on every supported Python version, and a package check.
# This workflow never publishes anything: build.yml is the only workflow that can.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # the viewer's lock file names Playwright for the browser checks; no browser is needed to build
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  lint:
    name: Lint, generated files, licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,bam]"
      - name: Lint
        run: ruff check src tests tools hatch_build.py
      - name: The catalogue JSON is up to date
        run: python tools/build_catalogue.py --check
      - name: The catalogue JSON of the single-cell and spatial add-on is up to date
        run: python tools/build_sc_catalogue.py --check
      - name: The generated documentation is up to date
        run: python tools/build_docs.py --check
      - name: Licences
        run: python tools/licence_check.py

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build the viewer
        working-directory: viewer
        run: |
          npm ci
          node build.mjs
          node verify/query_vectors.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,bam]"
      - name: Tests
        run: python -m pytest tests

  package:
    name: Wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build the viewer
        working-directory: viewer
        run: |
          npm ci
          node build.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the source distribution, and the wheel from it
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check what is in them
        run: python tools/check_dist.py dist/* --list
      - name: The wheel works in an environment of its own, without the network
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install "$(ls dist/*.whl)[all]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/tools/smoke_test.py" --installed
